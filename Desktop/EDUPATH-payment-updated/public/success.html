<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | Edu-Path</title>

  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#000000" />

  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Inter, system-ui, sans-serif; background: #f0fdf4; color: #172033;
    }
    .box {
      width: min(520px, 90%); padding: 42px; text-align: center; background: white;
      border-radius: 24px; box-shadow: 0 20px 60px rgba(21,128,61,.13);
    }
    .icon {
      width: 76px; height: 76px; display: grid; place-items: center; margin: auto;
      border-radius: 50%; background: #dcfce7; color: #15803d; font-size: 2.5rem; font-weight: 900;
    }
    h1 { margin-bottom: 10px; }
    p { color: #64748b; line-height: 1.7; }
    a {
      display: inline-block; margin-top: 20px; padding: 14px 22px; border-radius: 12px;
      background: #4f46e5; color: white; text-decoration: none; font-weight: 800;
    }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✓</div>
    <h1>Payment verified</h1>
    <p>Your Edu-Path payment was verified securely.</p>
    <p id="details"></p>
    <a id="returnButton" href="/">Return to Edu-Path</a>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const paymentId = params.get("payment_id");
    const plan = params.get("plan");
    document.getElementById("details").innerHTML =
      `Plan: <strong>${plan || "Premium"}</strong><br>Payment ID: <code>${paymentId || ""}</code>`;

    fetch("/api/config")
      .then(r => r.json())
      .then(config => {
        if (config.base44Url) {
          const url = new URL(config.base44Url);
          url.searchParams.set("payment", "success");
          if (paymentId) url.searchParams.set("payment_id", paymentId);
          document.getElementById("returnButton").href = url.toString();
        }
      });
  </script>
</body>
</html>
